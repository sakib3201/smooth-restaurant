info:
  name: List menus
  type: http
  seq: 1
  tags: [smoke]

http:
  method: GET
  url: "{{baseUrl}}/wp-json/smooth/v1/menus"
  params:
    - name: page
      value: "1"
      type: query
      description: 1-based page number
    - name: per_page
      value: "10"
      type: query
      description: Rows per page (1-100)
    - name: search
      value: ""
      type: query
      description: Substring matched against name and description
  headers:
    - name: Accept
      value: application/json
      description: JSON response

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.meta.page
      operator: eq
      value: "1"

settings:
  encodeUrl: true

docs: |-
  ## Purpose
  Public paginated list of published menus — the diner read path.

  ## Auth
  Public (no capability).

  ## Parameters
  | Name | In | Required | Description |
  | ---- | -- | -------- | ----------- |
  | page | query | no | 1-based page number, default 1 |
  | per_page | query | no | Rows per page 1-100, default 10 |
  | search | query | no | Substring matched against name and description |

  ## Success example
  ```json
  {"data": [{"id": 1, "name": "Lunch", "slug": "lunch", "status": "publish"}], "meta": {"page": 1, "per_page": 10}}
  ```

  ## Error cases
  - `401` — missing/invalid credentials (writes only; reads are public)
  - `404` — unknown id (single read only)

  ## Notes / Changelog
  - 2026-09-18: created alongside SMO-121
